{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FerroSur | Catalogo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'catalogo/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'catalogo:lista' %}">
                <span class="brand-mark">FS</span>
                <span><strong>FerroSur</strong><small>Soluciones para construir</small></span>
            </a>
            <span class="header-label">CATALOGO ONLINE</span>
        </div>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>FerroSur &middot; Herramientas, materiales y soluciones para tu proyecto.</p>
    </footer>
</body>
</html>
